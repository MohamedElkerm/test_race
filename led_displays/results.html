<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FINS 2026 - Published Results</title><link rel="stylesheet" href="/broadcast_tvg/base.css"><style>body{background:#06152f;color:white;padding:40px}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{text-align:left;padding:12px;border-bottom:1px solid #22436a}#warning{color:#f9b000}h1{margin-top:0}</style></head><body><h1>FINS 2026 / Published Results</h1><p id="warning">LOCAL ENGINEERING SERVICE / FISU PROVIDER ACCEPTANCE PENDING</p><main id="results"></main><script type="module">import{clock}from '/broadcast_tvg/render.js';const main=document.querySelector('main');async function load(){try{const r=await fetch('/api/public/results');const s=await r.json();main.replaceChildren();if(!s.heats.length){main.textContent='No published official results.';return}for(const h of s.heats){const head=document.createElement('h2');head.textContent=(s.mode==='TEST'?'TEST / ':'')+h.gender+' '+h.name+' / OFFICIAL';main.append(head);const table=document.createElement('table');for(const a of [...h.entries].sort((a,b)=>(a.rank??999)-(b.rank??999))){const tr=document.createElement('tr');for(const v of [a.rank??'—',a.name,a.country,a.university,a.irm||clock(a.ticks)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}table.append(tr)}main.append(table)}}catch{main.textContent='DATA CONNECTION LOST - RESULTS UNAVAILABLE'}}load();setInterval(load,2000);</script></body></html>
